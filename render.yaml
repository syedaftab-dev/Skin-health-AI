services:
  - type: web
    name: skin-health-ai
    runtime: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn skinai_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: skinai
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY_MINUTES
        value: "1440"
      - key: DEBUG
        value: "False"
